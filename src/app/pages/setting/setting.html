<div class="container mt-4">
  <h4 class="fw-semibold mb-4">⚙️ Settings</h4>

  <div class="row">
    <!-- Left Section -->
    <div class="col-lg-4">
      <div class="card shadow-sm rounded-4 mb-4">
        <div class="card-header bg-primary text-white fw-semibold rounded-top-4">
          Profile Settings
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control rounded-3" placeholder="Enter your name">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control rounded-3" placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Contact No</label>
              <input type="text" class="form-control rounded-3" placeholder="Enter contact number">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Gender</label>
              <select class="form-select rounded-3">
                <option selected disabled>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Department</label>
              <select class="form-select rounded-3">
                <option selected disabled>Select Department</option>
                <option>HR</option>
                <option>Development</option>
                <option>Finance</option>
                <option>Marketing</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control rounded-3" placeholder="Enter new password">
            </div>

            <div class="text-end">
              <button class="btn btn-primary rounded-pill px-4" type="button">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Right Section -->
    <div class="col-lg-8">
      <div class="card shadow-sm rounded-4 mb-4">
        <div class="card-header bg-success text-white fw-semibold rounded-top-4">
          Notification Preferences
        </div>
        <div class="card-body">
          <form>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="emailNotif" checked>
              <label class="form-check-label fw-semibold" for="emailNotif">Email Notifications</label>
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="smsNotif">
              <label class="form-check-label fw-semibold" for="smsNotif">SMS Notifications</label>
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="pushNotif" checked>
              <label class="form-check-label fw-semibold" for="pushNotif">Push Notifications</label>
            </div>

            <div class="text-end">
              <button class="btn btn-success rounded-pill px-4" type="button">Update Preferences</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm rounded-4">
        <div class="card-header bg-info text-white fw-semibold rounded-top-4">
          System Preferences
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label class="form-label fw-semibold">Theme</label>
              <select class="form-select rounded-3">
                <option>Light Mode</option>
                <option>Dark Mode</option>
              </select>
            </div>

            <div class="mb-3">
