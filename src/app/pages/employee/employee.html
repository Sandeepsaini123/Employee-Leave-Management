<div class="container-fluid py-4 px-3">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0 text-dark">
      <i class="bi bi-people-fill text-primary me-2"></i> Employee Management
    </h4>
    <button class="btn btn-primary rounded-pill px-3 d-flex align-items-center shadow-sm" (click)="openModel()">
      <i class="bi bi-plus-lg me-2"></i> Add Employee
    </button>
  </div>

  <!-- Employee List Card -->
  <div class="card border-0 shadow-lg rounded-4">
    <div class="card-header bg-light border-0 fw-semibold text-dark py-3 d-flex align-items-center">
      <i class="bi bi-list-task text-primary me-2"></i> Employee List
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="bg-primary text-white text-uppercase small text-center">
            <tr>
              <th class="py-3">ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Contact</th>
              <th>Department</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody class="text-center">
            @for (item of employeeList; track $index) {
            <tr>
              <td class="fw-semibold">{{ item.employeeId }}</td>
              <td>{{ item.employeeName }}</td>
              <td>{{ item.emailId }}</td>
              <td>{{ item.contactNo }}</td>
              <td>{{ item.deptName }}</td>
              <td>{{ item.role }}</td>
              <td>
                <div class="btn-group" role="group">
                  <!-- <button class="btn btn-sm btn-outline-info rounded-circle me-1" title="View">
                      <i class="bi bi-eye-fill"></i>
                    </button> -->
                  <button class="btn btn-sm btn-outline-warning rounded-circle me-1" title="Edit">
                    <i class="bi bi-pencil-fill"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger rounded-circle" title="Delete">
                    <i class="bi bi-trash-fill"></i>
                  </button>
                </div>
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Employee Modal -->
<div class="modal fade" #newModel tabindex="-1" aria-labelledby="addEmployeeLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">
      <!-- Header -->
      <div class="modal-header bg-primary text-white rounded-top-4">
        <h5 class="modal-title fw-semibold" id="addEmployeeLabel">
          <i class="bi bi-person-plus-fill me-2"></i> Add New Employee
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body px-4 py-3">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Employee Name</label>
              <input type="text" name="employeeName" [(ngModel)]="employeeObj.employeeName"
                class="form-control rounded-3" placeholder="Enter name">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Email ID</label>
              <input type="email" name="emailId" [(ngModel)]="employeeObj.emailId" class="form-control rounded-3"
                placeholder="Enter email">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Contact No</label>
              <input type="text" name="contactNo" [(ngModel)]="employeeObj.contactNo" class="form-control rounded-3"
                placeholder="Enter contact number">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Department</label>
              <select class="form-select rounded-3" [(ngModel)]="employeeObj.deptId" name="deptId"
                (ngModelChange)="employeeObj.deptId = +employeeObj.deptId">
                <option [ngValue]="0" disabled>Select Department</option>
                @for (item of deptList$ | async; track $index) {
                <option [ngValue]="item.deptId">{{ item.deptName }}</option>
                }
              </select>
            </div>


            <div class="col-md-6">
              <label class="form-label fw-semibold">Role</label>
              <select class="form-select rounded-3" [(ngModel)]="employeeObj.role" name="role">
                <option value="" disabled selected>Select Role</option>
                @for (item of roleList$ | async; track $index) {
                <option>{{ item }}</option>
                }
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Gender</label>
              <select class="form-select rounded-3" [(ngModel)]="employeeObj.gender" name="gender">
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" [(ngModel)]="employeeObj.password" name="password" class="form-control rounded-3"
                placeholder="Enter password">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Employee ID</label>
              <input type="number" [(ngModel)]="employeeObj.employeeId" name="employeeId" class="form-control rounded-3"
                placeholder="Enter ID">
            </div>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light border rounded-pill px-4" data-bs-dismiss="modal" (click)="closeModel()">
          <i class="bi bi-x-circle me-1"></i> Cancel
        </button>
        <button type="button" class="btn btn-primary rounded-pill px-4" (click)="onSaveEmployee()">
          <i class="bi bi-check-circle me-1"></i> Save Employee
        </button>
      </div>
    </div>
  </div>
</div>
